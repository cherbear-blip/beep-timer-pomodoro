<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beep & Pomodoro Timer</title>

  <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
    <link rel="icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      background: #f0f4f8;
    }
    h1 {
      margin-bottom: 1rem;
    }
    .timer-container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="number"] {
      width: 80px;
      padding: 0.5rem;
      font-size: 1rem;
      text-align: center;
      margin: 1rem 0;
    }
    button {
      padding: 0.7rem 1.2rem;
      margin: 0.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button.start {
      background-color: #28a745;
      color: white;
    }
    button.stop {
      background-color: #dc3545;
      color: white;
    }
    .countdown {
      font-size: 2rem;
      margin-top: 1rem;
    }
    .mode-toggle {
      margin: 1rem 0;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="timer-container">
    <h1>⏱️ Beep & Pomodoro Timer</h1>

    <div class="mode-toggle">
      <label>
        <input type="radio" name="mode" value="custom" checked> Custom Interval
      </label>
      <label>
        <input type="radio" name="mode" value="pomodoro"> Pomodoro Mode
      </label>
    </div>

    <div id="customInput">
      <label>Work (sec): </label>
      <input type="number" id="workDuration" value="10" min="1" />
      <label>Rest (sec): </label>
      <input type="number" id="breakDuration" value="5" min="1" />
    </div>

    <div>
      <button class="start" id="startBtn">Start</button>
      <button class="stop" id="stopBtn">Stop</button>
    </div>

    <div class="countdown" id="countdown">Ready</div>
  </div>

  <!-- Beep sound -->
  <audio id="beep" preload="auto">
    <source src="beep.mp3" type="audio/mpeg">
  </audio>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const countdownEl = document.getElementById('countdown');
    const beep = document.getElementById('beep');
    const customInput = document.getElementById('customInput');

    let mode = 'custom'; // ✅ Default mode
    let timer = null;
    let pomodoroState = 'focus';
    let customTimer = null;
    let animationFrame;
    let pomodoroEndTime;

    // ✅ unlock audio once on any user click
    document.body.addEventListener('click', () => {
      beep.play().then(() => {
        beep.pause();
        beep.currentTime = 0;
      }).catch(err => console.warn("Audio unlock failed:", err));
    }, { once: true });

    // Mode switch
    document.querySelectorAll('input[name="mode"]').forEach(input => {
      input.addEventListener('change', (e) => {
        mode = e.target.value;
        customInput.classList.toggle('hidden', mode !== 'custom');
        stopTimer();
        resetUI();

        if (mode === 'pomodoro') {
          pomodoroState = 'focus';
          countdownEl.textContent = 'Focus: 25:00';
        } else {
          countdownEl.textContent = 'Ready';
        }
      });
    });

    function resetUI() {
      stopTimer();
      countdownEl.textContent = 'Ready';
    }

    function startTimer() {
      if (mode === 'pomodoro') {
        startPomodoroTimer();
      } else if (mode === 'custom') {
        startCustomInterval();
      }
    }

    function stopTimer() {
      clearInterval(timer);
      clearInterval(customTimer);
      cancelAnimationFrame(animationFrame);
      animationFrame = null;
      timer = null;
      customTimer = null;
      pomodoroEndTime = null;
      startBtn.disabled = false;
      countdownEl.textContent = 'Stopped';
    }

    // Pomodoro logic
    function startPomodoroTimer() {
      const duration = pomodoroState === 'focus' ? 25 * 60 : 5 * 60;
      pomodoroEndTime = Date.now() + duration * 1000;

      updatePomodoroDisplay();

      function tick() {
        updatePomodoroDisplay();
        if (Date.now() < pomodoroEndTime) {
          animationFrame = requestAnimationFrame(tick);
        } else if (animationFrame !== null) {
          switchPomodoroState();
          playBeep();
          startPomodoroTimer();
        }
      }

      animationFrame = requestAnimationFrame(tick);
      startBtn.disabled = true;
    }

    function updatePomodoroDisplay() {
      const now = Date.now();
      const remaining = Math.max(0, Math.floor((pomodoroEndTime - now) / 1000));
      const min = Math.floor(remaining / 60).toString().padStart(2, '0');
      const sec = (remaining % 60).toString().padStart(2, '0');
      countdownEl.textContent = `${pomodoroState === 'focus' ? 'Focus' : 'Break'}: ${min}:${sec}`;
    }

    function switchPomodoroState() {
      pomodoroState = pomodoroState === 'focus' ? 'break' : 'focus';
    }

    // Custom Interval logic (previously Loop Mode)
    function startCustomInterval() {
      const workDuration = parseInt(document.getElementById('workDuration').value, 10);
      const breakDuration = parseInt(document.getElementById('breakDuration').value, 10);

      if (isNaN(workDuration) || workDuration <= 0 || isNaN(breakDuration) || breakDuration <= 0) {
        alert('Please enter valid work and rest times in seconds.');
        return;
      }

      let isWork = true;
      let remaining = workDuration;

      clearInterval(customTimer);
      countdownEl.textContent = `Work: ${remaining}s`;

      customTimer = setInterval(() => {
        remaining--;
        countdownEl.textContent = `${isWork ? 'Work' : 'Rest'}: ${remaining}s`;

        if (remaining <= 0) {
          playBeep();
          isWork = !isWork;
          remaining = isWork ? workDuration : breakDuration;
        }
      }, 1000);

      startBtn.disabled = true;
    }

    function playBeep() {
      try {
        beep.currentTime = 0;
        beep.play().catch(err => console.warn("Beep failed:", err));
      } catch (err) {
        console.warn("Beep playback error:", err);
      }
    }

    startBtn.addEventListener('click', () => {
      startTimer();
    });

    stopBtn.addEventListener('click', stopTimer);
  </script>

</body>
</html>
